app = "chores-brandonlocke"
primary_region = "ewr"

[env]
  DATABASE_PATH = "/data/chores.db"
  NODE_ENV = "production"
  # Story 6.3 flips this to https://chores.brandonlocke.xyz once DNS/cert
  # are live — a mismatched ORIGIN breaks SvelteKit form actions (CSRF).
  ORIGIN = "https://chores-brandonlocke.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # The volume cannot be shared across machines, so this app runs exactly one.
  min_machines_running = 0

# SESSION_SECRET is set via `fly secrets`, never here.

[[mounts]]
  source = "chores_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
