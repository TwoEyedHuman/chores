services:
  app:
    image: chores-app:local
    expose:
      - "3000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    stop_grace_period: 5s

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    stop_grace_period: 5s
