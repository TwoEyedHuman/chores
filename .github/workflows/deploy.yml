name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession must not deploy over each other.
concurrency: deploy-group

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A failing test aborts the job before flyctl ever runs.
      - run: npm test

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only builds on Fly's builder, so the native better-sqlite3
      # module is compiled in the same environment it runs in.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
